<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Библиотека офферов</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
.page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.topbar{padding-bottom:1.25rem;border-bottom:1px solid #e8e8e5;margin-bottom:1.25rem}
.topbar h1{font-size:22px;font-weight:500}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.fbtn{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer;font-family:inherit;transition:all .15s}
.fbtn:hover{border-color:#aaa;color:#1a1a18}
.fbtn.on{background:#1a1a18;color:#fff;border-color:#1a1a18}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e8e8e5;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#bbb}
.thumb{width:100%;height:130px;background:#efefec;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-ph{width:36px;height:36px;opacity:.15;position:absolute}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px}
.b-smartlink{background:#EEEDFE;color:#3C3489}
.b-epicwin{background:#E1F5EE;color:#085041}
.b-ecommerce{background:#FAEEDA;color:#633806}
.b-igaming{background:#FAECE7;color:#712B13}
.cbody{padding:12px}
.ctitle{font-size:13px;font-weight:500;color:#1a1a18;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccomment{font-size:12px;color:#aaa;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;justify-content:space-between;margin-bottom:4px}
.cl{font-size:12px;color:#aaa}
.cv{font-size:12px;color:#1a1a18;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%}
.sep{height:1px;background:#f0f0ed;margin:8px 0}
.list-wrap.hide{display:none}
.detail-wrap{display:none}
.detail-wrap.show{display:block}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#aaa;cursor:pointer;padding:.75rem 0 1.25rem;border:none;background:none;font-family:inherit}
.back:hover{color:#1a1a18}
.dtitle{font-size:20px;font-weight:500;margin-bottom:4px}
.dcomment{font-size:14px;color:#aaa;margin-bottom:1rem}
.dmeta{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap}
.dchip{font-size:12px;padding:4px 10px;border-radius:8px;background:#f0f0ed;color:#666}
.gallery{border-radius:12px;overflow:hidden;background:#efefec;margin-bottom:1.5rem}
.gimgwrap{width:100%;height:300px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gimgwrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:none}
.gimgwrap img.cur{display:block}
.gph{width:60px;height:60px;opacity:.12}
.gnav{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #e8e8e5}
.gdot{width:6px;height:6px;border-radius:50%;background:#ddd;cursor:pointer;flex-shrink:0}
.gdot.on{background:#1a1a18}
.garr{font-size:16px;color:#aaa;cursor:pointer;border:none;background:none;font-family:inherit;padding:2px 4px;line-height:1}
.garr:hover{color:#1a1a18}
.gcnt{font-size:12px;color:#aaa;margin-left:auto}
.slabel{font-size:11px;font-weight:500;color:#aaa;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.rtable{width:100%;border-collapse:collapse;margin-bottom:2rem}
.rtable th{font-size:12px;font-weight:500;color:#aaa;text-align:left;padding:7px 10px;border-bottom:1px solid #f0f0ed}
.rtable td{font-size:13px;color:#1a1a18;padding:9px 10px;border-bottom:1px solid #f0f0ed}
.rtable tr:last-child td{border-bottom:none}
.rtable tr:hover td{background:#fafaf8}
@media(max-width:600px){
  .page{padding:1.25rem 1rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .thumb{height:110px}
  .gimgwrap{height:200px}
}
</style>
</head>
<body>
<div class="page">
  <div class="list-wrap" id="listWrap">
    <div class="topbar"><h1>Библиотека офферов</h1></div>
    <div class="filters" id="filters">
      <button class="fbtn on" data-cat="all">Все</button>
      <button class="fbtn" data-cat="In-house smartlink">In-house smartlink</button>
      <button class="fbtn" data-cat="Epicwin">Epicwin</button>
      <button class="fbtn" data-cat="Ecommerce">Ecommerce</button>
      <button class="fbtn" data-cat="iGaming">iGaming</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="detail-wrap" id="detailWrap">
    <button class="back" id="backBtn">← Все офферы</button>
    <div id="detailContent"></div>
  </div>
</div>
<script>
const offers = [
  {
    cat:"In-house smartlink",
    title:"Playable | Click Box \u2013 Simple",
    comment:"iGaming smartlink after preland",
    geo:"PH, ID, PK, BD, BR, TH, ZA",
    limit:"200$ daily",
    previews:[
      "https://i.ibb.co/H9LVRVD/FSBv-A-ce-QBK4-IW2mg1ra-Sw.png",
      "https://i.ibb.co/Ld0KwbCF/image.png"
    ],
    rateCard:[
      {geo:"PH",model:"CPM",rate:"17.853"},
      {geo:"ID",model:"CPM",rate:"8.414"},
      {geo:"PK",model:"CPM",rate:"13.181"},
      {geo:"BR",model:"CPM",rate:"10.03"},
      {geo:"BD",model:"CPM",rate:"12.597"},
      {geo:"ZA",model:"CPM",rate:"7.325"},
      {geo:"TH",model:"CPM",rate:"12.769"}
    ]
  },
  {
    cat:"In-house smartlink",
    title:"Playable | Click Box",
    comment:"iGaming smartlink after preland",
    geo:"PH, ID, PK, BD, BR, TH, ZA",
    limit:"200$ daily",
    previews:[
      "https://i.ibb.co/yBxm7CV2/Xqh-Lp-XRZSM2-K4w7q-In-Ic-Bg.png",
      "https://i.ibb.co/5WyK1ZGm/DCNp-Lql-ZQ8amf2-H7-Qg-Nu-Ig.png",
      "https://i.ibb.co/1tY8WwNk/KO8-IJi-ODTJSUgh-Wu-Fi-WIf-A.png"
    ],
    rateCard:[
      {geo:"PH",model:"CPM",rate:"31.545"},
      {geo:"ID",model:"CPM",rate:"12.648"},
      {geo:"PK",model:"CPM",rate:"13.239"},
      {geo:"BD",model:"CPM",rate:"12.204"},
      {geo:"BR",model:"CPM",rate:"13.043"},
      {geo:"ZA",model:"CPM",rate:"18.066"},
      {geo:"TH",model:"CPM",rate:"23.278"}
    ]
  },
  {
    cat:"In-house smartlink",
    title:"Playable | Dream Coin",
    comment:"iGaming smartlink after preland",
    geo:"PH, ID, PK, BD, BR, TH, ZA",
    limit:"200$ daily",
    previews:[
      "https://i.ibb.co/XxnZzDWW/PSSTYId-LQey-Wb-Qlz-TEx-FFA.png",
      "https://i.ibb.co/MkC8P0Wm/WM39h-Swy-Rq-Rlsr9a-Sk-Sew.png",
      "https://i.ibb.co/k630cc54/v-S77-BWp-RQay-Go4xe-UJt-ILw.png"
    ],
    rateCard:[
      {geo:"PH",model:"CPM",rate:"20.668"},
      {geo:"PK",model:"CPM",rate:"14.33"},
      {geo:"BD",model:"CPM",rate:"6.537"},
      {geo:"TH",model:"CPM",rate:"12.824"},
      {geo:"ID",model:"CPM",rate:"5.88"},
      {geo:"BR",model:"CPM",rate:"10.256"},
      {geo:"ZA",model:"CPM",rate:"4.845"}
    ]
  },
  {
    cat:"In-house smartlink",
    title:"Click Box Africa",
    comment:"Betway ZA after preland",
    geo:"ZA",
    limit:"200$ daily",
    previews:[
      "https://i.ibb.co/tk2Ysg9/h-BSRNSo-TREu9h-GSN-OZr-CA.png",
      "https://i.ibb.co/s9N1z3TY/Gyb-Yx-Lc-ET-G5-VNw-Zi-VX9t-Q.png",
      "https://i.ibb.co/zWFVY4DF/tq-HG0-Kz-SPmzibo-QVGIMgg.png",
      "https://i.ibb.co/PstFNFN3/HA9-KO-Q6-QQe0-N4cdknk-CYA.png"
    ],
    rateCard:[
      {geo:"ZA",model:"CPM",rate:"50"}
    ]
  }
];

const bClass={"In-house smartlink":"b-smartlink","Epicwin":"b-epicwin","Ecommerce":"b-ecommerce","iGaming":"b-igaming"};
const phSvg=`<svg class="thumb-ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
const phSvgLg=`<svg class="gph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;

let curImg=0;

function renderGrid(cat){
  const g=document.getElementById("grid");
  const list=cat==="all"?offers:offers.filter(o=>o.cat===cat);
  if(!list.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#aaa;font-size:14px">Нет офферов</div>';return;}
  g.innerHTML=list.map(o=>{
    const idx=offers.indexOf(o);
    const bc=bClass[o.cat]||"b-smartlink";
    const thumb=o.previews.length?`<img src="${o.previews[0]}" loading="lazy" onerror="this.style.display='none'">`:"";
    return `<div class="card" data-idx="${idx}">
      <div class="thumb">${thumb}${phSvg}<span class="badge ${bc}">${o.cat}</span></div>
      <div class="cbody">
        <div class="ctitle" title="${o.title}">${o.title}</div>
        ${o.comment?`<div class="ccomment">${o.comment}</div>`:""}
        <div class="crow"><span class="cl">Гео</span><span class="cv">${o.geo}</span></div>
        <div class="sep"></div>
        <div class="crow"><span class="cl">Лимит</span><span class="cv">${o.limit}</span></div>
      </div>
    </div>`;
  }).join("");
  g.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openDetail(+c.dataset.idx)));
}

function openDetail(idx){
  curImg=0;
  const o=offers[idx];
  const bc=bClass[o.cat]||"b-smartlink";
  const imgs=o.previews||[];

  let imgHtml=imgs.map((src,i)=>`<img src="${src}" class="${i===0?'cur':''}" data-i="${i}" loading="lazy" onerror="this.style.display='none'">`).join("");
  let navHtml="";
  if(imgs.length>1){
    navHtml=`<div class="gnav">
      <button class="garr" id="gprev">←</button>
      <button class="garr" id="gnext">→</button>
      ${imgs.map((_,i)=>`<div class="gdot${i===0?" on":""}" data-i="${i}"></div>`).join("")}
      <span class="gcnt" id="gcnt">1 / ${imgs.length}</span>
    </div>`;
  }

  document.getElementById("detailContent").innerHTML=`
    <div style="margin-bottom:6px"><span class="badge ${bc}" style="position:static;display:inline-block">${o.cat}</span></div>
    <div class="dtitle">${o.title}</div>
    <div class="dcomment">${o.comment||""}</div>
    <div class="dmeta">
      <span class="dchip">Гео: ${o.geo}</span>
      <span class="dchip">Лимит: ${o.limit}</span>
    </div>
    <div class="gallery">
      <div class="gimgwrap" id="gimgWrap">${imgHtml}${phSvgLg}</div>
      ${navHtml}
    </div>
    <div class="slabel">Рейт-карта</div>
    <table class="rtable">
      <thead><tr><th>Гео</th><th>Модель</th><th>Рейт</th></tr></thead>
      <tbody>${o.rateCard.map(r=>`<tr><td>${r.geo}</td><td>${r.model}</td><td>$${r.rate}</td></tr>`).join("")}</tbody>
    </table>
  `;

  if(imgs.length>1){
    const allImgs=document.querySelectorAll("#gimgWrap img");
    const dots=document.querySelectorAll(".gdot");
    function goTo(n){
      allImgs[curImg].classList.remove("cur");
      dots[curImg].classList.remove("on");
      curImg=n;
      allImgs[curImg].classList.add("cur");
      dots[curImg].classList.add("on");
      document.getElementById("gcnt").textContent=`${curImg+1} / ${imgs.length}`;
    }
    document.getElementById("gprev").onclick=()=>goTo((curImg-1+imgs.length)%imgs.length);
    document.getElementById("gnext").onclick=()=>goTo((curImg+1)%imgs.length);
    dots.forEach(d=>d.addEventListener("click",()=>goTo(+d.dataset.i)));
  }

  document.getElementById("listWrap").classList.add("hide");
  document.getElementById("detailWrap").classList.add("show");
  window.scrollTo(0,0);
}

document.getElementById("backBtn").addEventListener("click",()=>{
  document.getElementById("detailWrap").classList.remove("show");
  document.getElementById("listWrap").classList.remove("hide");
});
document.getElementById("filters").addEventListener("click",e=>{
  const btn=e.target.closest(".fbtn");
  if(!btn)return;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  renderGrid(btn.dataset.cat);
});

renderGrid("all");
</script>
</body>
</html>
