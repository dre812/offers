<meta charset="UTF-8"/>

<title>Библиотека офферов</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
.page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.topbar{padding-bottom:1.25rem;border-bottom:1px solid #e8e8e5;margin-bottom:1.25rem}
.topbar h1{font-size:22px;font-weight:500}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.fbtn{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer;font-family:inherit;transition:all .15s}
.fbtn:hover{border-color:#aaa;color:#1a1a18}
.fbtn.on{background:#1a1a18;color:#fff;border-color:#1a1a18}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e8e8e5;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#bbb}
.thumb{width:100%;height:130px;background:#efefec;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-ph{width:36px;height:36px;opacity:.15;position:absolute;pointer-events:none}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px}
.b-smartlink{background:#EEEDFE;color:#3C3489}
.b-epicwin{background:#E1F5EE;color:#085041}
.b-ecommerce{background:#FAEEDA;color:#633806}
.b-igaming{background:#FAECE7;color:#712B13}
.cbody{padding:12px}
.ctitle{font-size:13px;font-weight:500;color:#1a1a18;margin-bottom:6px;line-height:1.4;word-break:break-word}
.crow{display:flex;justify-content:space-between;margin-bottom:4px;gap:8px}
.cl{font-size:12px;color:#aaa;white-space:nowrap}
.cv{font-size:12px;color:#1a1a18;text-align:right;word-break:break-word}
.sep{height:1px;background:#f0f0ed;margin:8px 0}
.rtm{width:100%;border-collapse:collapse;margin-top:2px}
.rtm td{font-size:11px;padding:2px 0;vertical-align:top}
.rtm td:first-child{color:#aaa;width:38px}
.rtm td:nth-child(2){color:#aaa;width:44px}
.rtm td:last-child{text-align:right;color:#1a1a18;font-weight:500}
.list-wrap.hide{display:none}
.detail-wrap{display:none}
.detail-wrap.show{display:block}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#aaa;cursor:pointer;padding:.75rem 0 1.25rem;border:none;background:none;font-family:inherit}
.back:hover{color:#1a1a18}
.dtitle{font-size:20px;font-weight:500;margin-bottom:1rem;line-height:1.3;word-break:break-word}
.dmeta{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap}
.dchip{font-size:12px;padding:4px 10px;border-radius:8px;background:#f0f0ed;color:#666}
.dcomment-block{font-size:13px;color:#666;background:#f8f8f6;border-radius:8px;padding:10px 12px;margin-bottom:1.25rem;white-space:pre-wrap;line-height:1.6}
.dcomment-block a{color:#4a6cf7;text-decoration:none}
.dcomment-block a:hover{text-decoration:underline}
.gallery{border-radius:12px;overflow:hidden;background:#efefec;margin-bottom:1.5rem}
.gimgwrap{width:100%;height:300px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gimgwrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:none}
.gimgwrap img.cur{display:block}
.gph{width:60px;height:60px;opacity:.12}
.gnav{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #e8e8e5}
.gdot{width:6px;height:6px;border-radius:50%;background:#ddd;cursor:pointer;flex-shrink:0}
.gdot.on{background:#1a1a18}
.garr{font-size:16px;color:#aaa;cursor:pointer;border:none;background:none;font-family:inherit;padding:2px 6px;line-height:1}
.garr:hover{color:#1a1a18}
.gcnt{font-size:12px;color:#aaa;margin-left:auto}
.slabel{font-size:11px;font-weight:500;color:#aaa;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.rtable{width:100%;border-collapse:collapse;margin-bottom:2rem}
.rtable th{font-size:12px;font-weight:500;color:#aaa;text-align:left;padding:7px 10px;border-bottom:1px solid #f0f0ed}
.rtable td{font-size:13px;color:#1a1a18;padding:9px 10px;border-bottom:1px solid #f0f0ed;vertical-align:top}
.rtable tr:last-child td{border-bottom:none}
.rtable tr:hover td{background:#fafaf8}
.no-rates{font-size:13px;color:#aaa;margin-bottom:2rem}
@media(max-width:600px){
  .page{padding:1.25rem 1rem}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .thumb{height:110px}
  .gimgwrap{height:200px}
}
</style>

const bClass={"In-house smartlink":"b-smartlink","Epicwin":"b-epicwin","Ecommerce":"b-ecommerce","iGaming":"b-igaming"};
const phSvg=`<svg class="thumb-ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
const phSvgLg=`<svg class="gph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
let curImg=0;

function linkify(t){return t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>');}
function visibleRc(rc){return (rc||[]).filter(r=>r.rate||r.model);}
function miniRc(rc){
  const rows=visibleRc(rc);
  if(!rows.length)return '';
  return '<table class="rtm">'+rows.map(r=>`<tr><td>${r.geo}</td><td>${r.model}</td><td>${r.rate}</td></tr>`).join("")+'</table>';
}
function fullRc(rc){
  const rows=visibleRc(rc);
  if(!rows.length)return '<div class="no-rates">Рейт-карта уточняется</div>';
  return `<table class="rtable"><thead><tr><th>Гео</th><th>Модель</th><th>Рейт/КПИ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.geo}</td><td>${r.model}</td><td>${r.rate}</td></tr>`).join("")}</tbody></table>`;
}

function renderGrid(cat){
  const g=document.getElementById("grid");
  const list=cat==="all"?offers:offers.filter(o=>o.cat===cat);
  if(!list.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#aaa;font-size:14px">Нет офферов</div>';return;}
  g.innerHTML=list.map(o=>{
    const idx=offers.indexOf(o);
    const bc=bClass[o.cat]||"b-igaming";
    const thumb=`<img src="${o.previews[0]}" loading="lazy" onerror="this.style.display='none'">`;
    const rcMini=miniRc(o.rateCard);
    return `<div class="card" data-idx="${idx}">
      <div class="thumb">${thumb}${phSvg}<span class="badge ${bc}">${o.cat}</span></div>
      <div class="cbody">
        <div class="ctitle">${o.title}</div>
        <div class="crow"><span class="cl">Гео</span><span class="cv">${o.geo}</span></div>
        ${o.limit?`<div class="crow"><span class="cl">Лимит</span><span class="cv">${o.limit}</span></div>`:""}
        ${rcMini?`<div class="sep"></div>${rcMini}`:""}
      </div>
    </div>`;
  }).join("");
  g.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openDetail(+c.dataset.idx)));
}

function openDetail(idx){
  curImg=0;
  const o=offers[idx];
  const bc=bClass[o.cat]||"b-igaming";
  const imgs=o.previews||[];
  let imgHtml=imgs.map((src,i)=>`<img src="${src}" class="${i===0?"cur":""}" data-i="${i}" loading="lazy" onerror="this.style.display='none'">`).join("");
  let navHtml="";
  if(imgs.length>1){
    navHtml=`<div class="gnav">
      <button class="garr" id="gprev">←</button><button class="garr" id="gnext">→</button>
      ${imgs.map((_,i)=>`<div class="gdot${i===0?" on":""}" data-i="${i}"></div>`).join("")}
      <span class="gcnt" id="gcnt">1 / ${imgs.length}</span></div>`;
  }
  const commentHtml=o.comment?`<div class="dcomment-block">${linkify(o.comment)}</div>`:"";
  document.getElementById("detailContent").innerHTML=`
    <div style="margin-bottom:8px"><span class="badge ${bc}" style="position:static;display:inline-block">${o.cat}</span></div>
    <div class="dtitle">${o.title}</div>
    <div class="dmeta">
      <span class="dchip">Гео: ${o.geo}</span>
      ${o.limit?`<span class="dchip">Лимит: ${o.limit}</span>`:""}
    </div>
    ${commentHtml}
    <div class="gallery"><div class="gimgwrap" id="gimgWrap">${imgHtml}${phSvgLg}</div>${navHtml}</div>
    <div class="slabel">Рейт-карта / КПИ</div>${fullRc(o.rateCard)}`;
  if(imgs.length>1){
    const allImgs=document.querySelectorAll("#gimgWrap img");
    const dots=document.querySelectorAll(".gdot");
    function goTo(n){
      allImgs[curImg].classList.remove("cur");dots[curImg].classList.remove("on");
      curImg=n;allImgs[curImg].classList.add("cur");dots[curImg].classList.add("on");
      document.getElementById("gcnt").textContent=`${curImg+1} / ${imgs.length}`;
    }
    document.getElementById("gprev").onclick=()=>goTo((curImg-1+imgs.length)%imgs.length);
    document.getElementById("gnext").onclick=()=>goTo((curImg+1)%imgs.length);
    dots.forEach(d=>d.addEventListener("click",()=>goTo(+d.dataset.i)));
  }
  document.getElementById("listWrap").classList.add("hide");
  document.getElementById("detailWrap").classList.add("show");
  window.scrollTo(0,0);
}
document.getElementById("backBtn").addEventListener("click",()=>{
  document.getElementById("detailWrap").classList.remove("show");
  document.getElementById("listWrap").classList.remove("hide");
});
document.getElementById("filters").addEventListener("click",e=>{
  const btn=e.target.closest(".fbtn");
  if(!btn)return;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  renderGrid(btn.dataset.cat);
});
renderGrid("all");
</script>
